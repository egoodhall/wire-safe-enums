name: Publish Release

on:
  release:
    types:
    - published

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    -
      name: Validate release version
      shell: python
      run: | 
        import re
        import os
        re.compile(r"^\d+\.\d+\.\d+(?:-[a-zA-Z0-9]+)*$").match(os.environ["version"])
      env:
        version: ${{ github.ref_name }}
    -
      name: Checkout code
      uses: actions/checkout@v4
    -
      name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'
    -
      name: Publish
      run: ./gradlew publish -Pversion=${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
