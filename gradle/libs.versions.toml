[versions]
assertj = "3.24.2"
google-auto-common = "1.2.1"
google-auto-service = "1.0.1"
google-compile-testing = "0.21.0"
google-guava = "33.0.0-jre"
google-guice = "7.0.0"
jackson = "2.16.1"
junit = "5.9.2"
kotlin = "2.2.0"
kotlinx-serialization = "1.9.0"
palantir-javapoet = "0.5.0"
spotless = "7.2.1"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
google-auto-common = { module = "com.google.auto:auto-common", version.ref = "google-auto-common" }
google-auto-service = { module = "com.google.auto.service:auto-service", version.ref = "google-auto-service" }
google-compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "google-compile-testing" }
google-guava = { module = "com.google.guava:guava", version.ref = "google-guava" }
google-guice = { module = "com.google.inject:guice", version.ref = "google-guice" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
palantir-javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "palantir-javapoet" }

[bundles]
testing = ["junit-jupiter", "assertj-core"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
